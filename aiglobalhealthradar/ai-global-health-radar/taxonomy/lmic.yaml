# Regional groupings (World Bank regions, excluding high-income members)
regions:
  sub_saharan_africa:
    full_name: "Sub-Saharan Africa"
    short: "SSA"
  south_asia:
    full_name: "South Asia"
    short: "SA"
  east_asia_pacific:
    full_name: "East Asia and Pacific"
    short: "EAP"
  latin_america_caribbean:
    full_name: "Latin America and the Caribbean"
    short: "LAC"
  middle_east_north_africa:
    full_name: "Middle East and North Africa"
    short: "MENA"
  europe_central_asia:
    full_name: "Europe and Central Asia"
    short: "ECA"

# Notes on edge cases
edge_cases:
  - country: "Russia"
    note: "Classified upper-middle income but politically and operationally distinct from typical LMIC global-health context. Most cards should not treat Russia as a target LMIC."
  - country: "Cuba"
    note: "Limited recent World Bank data; classification status fluctuates. Verify before using."
  - country: "Lebanon"
    note: "Classification moved from upper-middle to lower-middle in recent years due to economic crisis. Verify current status."
  - country: "Ukraine"
    note: "Active conflict context. Standard LMIC classification still applies but operational context differs."
