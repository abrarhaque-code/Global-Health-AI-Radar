# World Bank country income classifications used for LMIC scoping
# Effective FY2026 (July 2025 through June 2026)
# Source: https://datatopics.worldbank.org/world-development-indicators/the-world-by-income-and-region.html
#
# Refresh discipline: annually around July when the World Bank publishes the new
# classification list. Update `version` and `next_refresh` fields.
#
# The list below is illustrative and based on the FY2026 classification. For
# programmatic or hard-filter use, the canonical source is the World Bank API:
# https://api.worldbank.org/v2/country
# Always verify against the canonical source before relying on a specific country
# entry for a screening decision.

version: "FY2026"
next_refresh: "2026-07-01"
source_url: "https://datatopics.worldbank.org/world-development-indicators/the-world-by-income-and-region.html"

# Priority markets per your thesis (see docs/thesis.example.md). Replace these with your own.
# These are the countries where the workbench focuses discovery and outreach
# weight. All countries in the World Bank LMIC classification are in scope,
# but priority countries get heavier discovery effort and faster card cadence.
priority_markets:
  description: "Priority LMIC markets per your thesis (see docs/thesis.example.md). Replace these with your own."
  sub_saharan_africa: [NGA, KEN, GHA, RWA, ZAF, ETH, SEN, UGA, TZA]
  north_africa_mena: [EGY, MAR, SAU, ARE]  # SAU and ARE are HIC by World Bank but serve as commercial bases for LMIC deployment
  south_asia: [IND, BGD, PAK]
  southeast_asia: [IDN, VNM, PHL]
  latin_america: [BRA, MEX, COL, PER]
  cross_border_note: "Companies headquartered in USA, GBR, EU member states, or SGP qualify if they have primary commercial activity in LMICs"

# All three lists together form the LMIC universe used by this workbench
