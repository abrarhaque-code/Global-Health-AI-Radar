specialist_vcs:
  description: "Specialist VCs with LMIC AI health exposure (replace with your own network)"
  entities:
    - id: example_global_vc
      name: "Example Global VC"
      notes: "Placeholder for a generalist or deep-tech VC active in your pipeline"
    - id: example_africa_vc
      name: "Example Africa-focused VC"
      notes: "Placeholder for a regional venture firm in your network"
    - id: example_health_vc
      name: "Example Health-specialist VC"
      notes: "Placeholder for a health or impact-focused venture firm"
    - id: example_accelerator
      name: "Example Accelerator"
      notes: "Placeholder for an accelerator whose graduates you track"

# Usage notes
usage:
  - "Tag `notable_investors` in card front-matter with the `id` from this file (e.g., `gates`, `roche`)"
  - "A card whose `notable_investors` include any of the foundations_and_dfis entities should be reviewed for elevated outreach priority"
  - "Strategics in deal rounds are particularly strong signals for downstream commercial partnership potential"
  - "Refresh this file when major new programs are announced or when your network changes"
