# Example config. Replace themes/partners with your own thesis.
# Capital partners and tailwinds for AI in LMIC health
# Source: your thesis (see docs/thesis.example.md). Replace these with your own.
# This is an EXAMPLE partner vocabulary. The entities below are public
# institutions used to illustrate the structure; replace them with the partners
# relevant to your own network and strategy.
# A round led or co-led by any of the named partners is a positive signal that
# raises confidence in scoring. Use this file as a controlled vocabulary when
# tagging `notable_investors` in card front-matter.

version: "1.2"
last_updated: "2026-05-28"

